name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust tests
        run: cargo test --workspace --all-features

      - name: Run Rust lints
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  python-test:
    name: Python Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install maturin
        run: pip install maturin

      - name: Build Python extension
        run: maturin build --release
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Create virtual environment
        run: python -m venv test-venv

      - name: Install wheel and test dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          source test-venv/bin/activate
          pip install target/wheels/*.whl
          pip install pytest

      - name: Install wheel and test dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          test-venv\Scripts\activate
          pip install (Get-ChildItem target/wheels/*.whl).FullName
          pip install pytest
        shell: pwsh

      - name: Run Python tests (Unix)
        if: runner.os != 'Windows'
        run: |
          source test-venv/bin/activate
          pytest tests/python -v

      - name: Run Python tests (Windows)
        if: runner.os == 'Windows'
        run: |
          test-venv\Scripts\activate
          pytest tests/python -v
        shell: pwsh
